<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>CT Fields Einstellungen</title>

    <link
        rel="stylesheet"
        href="https://p.trellocdn.com/power-up.min.css"
    >

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            background: transparent;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 18px;
            padding: 16px 18px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
        }

        .page-header h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            line-height: 1.15;
        }

        .page-header p {
            margin: 0;
            opacity: 0.75;
            line-height: 1.4;
        }

        .header-badge {
            white-space: nowrap;
            font-size: 12px;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(87, 157, 255, 0.15);
            color: #9dc1ff;
        }

        #fieldsContainer {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 110px;
        }

        .field-card {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
        }

        .field-summary {
            list-style: none;
            cursor: pointer;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            user-select: none;
        }

        .field-summary::-webkit-details-marker {
            display: none;
        }

        .summary-left {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .summary-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            word-break: break-word;
        }

        .summary-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.08);
            opacity: 0.9;
        }

        .summary-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .summary-color {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .summary-chevron {
            font-size: 18px;
            line-height: 1;
            opacity: 0.8;
            transition: transform 0.18s ease;
        }

        details[open] .summary-chevron {
            transform: rotate(90deg);
        }

        .field-body {
            padding: 0 16px 16px 16px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .field-grid {
            margin-top: 14px;
            display: grid;
            grid-template-columns: minmax(180px, 1fr) 160px 160px;
            gap: 12px;
        }

        .group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .group label {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.75;
        }

        input,
        select {
            width: 100%;
            margin: 0;
        }

        .field-actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .field-actions button {
            margin: 0;
        }

        .options-panel {
            margin-top: 16px;
            padding: 14px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .options-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .options-head h3 {
            margin: 0;
            font-size: 15px;
        }

        .options-head p {
            margin: 2px 0 0 0;
            font-size: 12px;
            opacity: 0.7;
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-row {
            display: grid;
            grid-template-columns: minmax(160px, 1fr) 160px auto;
            gap: 8px;
            align-items: center;
        }

        .actions {
            display: flex;
            gap: 4px;
        }

        .actions button {
            margin: 0;
            min-width: 34px;
            padding: 6px 8px;
        }

        #addFieldButton {
            margin-top: 4px;
        }

        .sticky-bar {
            position: sticky;
            bottom: 0;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(24, 27, 33, 0.96);
            backdrop-filter: blur(10px);
            box-shadow: 0 -6px 18px rgba(0,0,0,0.18);
        }

        .sticky-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 10px;
        }

        .size-info {
            font-size: 12px;
            opacity: 0.75;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(255,255,255,0.08);
        }

        .status-neutral {
            color: #d6d9df;
        }

        .status-info {
            color: #9dc1ff;
            background: rgba(87,157,255,0.15);
        }

        .status-warning {
            color: #ffd58a;
            background: rgba(197, 140, 0, 0.18);
        }

        .status-success {
            color: #8ef0c0;
            background: rgba(52, 168, 83, 0.18);
        }

        .status-error {
            color: #ff9f9f;
            background: rgba(185, 64, 64, 0.18);
        }

        .sticky-actions {
            display: flex;
            gap: 10px;
        }

        .sticky-actions button {
            flex: 1;
            margin: 0;
        }

        .warning-size {
            color: #ffd58a;
        }

        .error-size {
            color: #ff9f9f;
        }

        @media (max-width: 820px) {
            .field-grid {
                grid-template-columns: 1fr 1fr;
            }

            .option-row {
                grid-template-columns: 1fr 140px auto;
            }
        }

        @media (max-width: 620px) {
            .page-header {
                flex-direction: column;
            }

            .field-grid {
                grid-template-columns: 1fr;
            }

            .option-row {
                grid-template-columns: 1fr;
            }

            .sticky-top {
                flex-direction: column;
            }

            .sticky-actions {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    <div class="page-header">
        <div>
            <h1>CT Fields</h1>
            <p>
                Verwalte hier die Kategorien für das gesamte Board.
                Du kannst Kategorien umbenennen, neue Kategorien erstellen,
                Optionen verwalten und die Reihenfolge anpassen.
            </p>
        </div>

        <div class="header-badge">
            Board-Einstellungen
        </div>
    </div>

    <div id="fieldsContainer"></div>

    <button
        type="button"
        id="addFieldButton"
    >
        + Neue Kategorie
    </button>

    <div class="sticky-bar">
        <div class="sticky-top">
            <div id="sizeInfo" class="size-info"></div>

            <div
                id="status"
                class="status-pill status-neutral"
            >
                Bereit
            </div>
        </div>

        <div class="sticky-actions">
            <button
                type="button"
                id="defaultsButton"
            >
                Standardwerte laden
            </button>

            <button
                type="button"
                class="mod-primary"
                id="saveButton"
            >
                Einstellungen speichern
            </button>
        </div>
    </div>

    <script src="./config.js"></script>
    <script src="./settings.js"></script>

</body>
</html>
