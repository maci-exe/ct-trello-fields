<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>CT Fields Einstellungen</title>


    <link
        rel="stylesheet"
        href="https://p.trellocdn.com/power-up.min.css"
    >


    <script src="https://p.trellocdn.com/power-up.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 20px;
        }


        #fieldsContainer {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }


        .field-card {

            border: 1px solid rgba(128,128,128,0.35);

            border-radius: 7px;

            padding: 14px;

        }


        .field-header {

            display: grid;

            grid-template-columns:
                minmax(160px, 1fr)
                130px
                130px
                auto;

            gap: 8px;

            align-items: center;

        }


        input,
        select {
            width: 100%;
            margin: 0;
        }


        .actions {
            display: flex;
            gap: 4px;
        }


        .actions button {
            margin: 0;
            padding: 6px 8px;
        }


        .options {

            margin-top: 14px;

            padding-top: 12px;

            border-top:
                1px solid rgba(128,128,128,0.25);

        }


        .option-row {

            display: grid;

            grid-template-columns:
                minmax(160px, 1fr)
                150px
                auto;

            gap: 8px;

            margin-bottom: 7px;

            align-items: center;

        }


        .option-title {

            font-size: 12px;

            opacity: 0.7;

            margin-bottom: 8px;

        }


        .add-option {
            margin-top: 4px;
        }


        #addFieldButton {
            margin-top: 18px;
        }


        .bottom {

            position: sticky;

            bottom: 0;

            margin-top: 24px;

            padding-top: 14px;

            background: inherit;

        }


        .bottom-buttons {

            display: flex;

            gap: 10px;

        }


        .bottom-buttons button {
            flex: 1;
        }


        #sizeInfo {

            margin-top: 10px;

            font-size: 12px;

            opacity: 0.65;

        }


        #status {

            margin-top: 8px;

            min-height: 18px;

        }


        .error {
            color: #ef5c48;
        }


        .success {
            color: #4bce97;
        }

    </style>

</head>


<body>


<div id="fieldsContainer"></div>


<button
    type="button"
    id="addFieldButton"
>
    + Neue Kategorie
</button>


<div class="bottom">

    <div class="bottom-buttons">

        <button
            type="button"
            id="defaultsButton"
        >
            Standardwerte laden
        </button>


        <button
            type="button"
            class="mod-primary"
            id="saveButton"
        >
            Einstellungen speichern
        </button>

    </div>


    <div id="sizeInfo"></div>

    <div id="status"></div>

</div>


<script src="./config.js"></script>
<script src="./settings.js"></script>


</body>

</html>
