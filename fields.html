<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>CT Fields</title>


    <link
        rel="stylesheet"
        href="https://p.trellocdn.com/power-up.min.css"
    >


    <script src="https://p.trellocdn.com/power-up.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 4px 2px;
            background: transparent;
        }


        #ctFields {
            width: 100%;
        }


        #fieldsGrid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 12px 10px;

        }


        .field {
            min-width: 0;
        }


        .field label {

            display: block;

            font-weight: 600;

            margin-bottom: 5px;

            font-size: 13px;

        }


        select,
        input {

            width: 100%;

            height: 40px;

            padding: 7px 10px;

            border: none;

            border-radius: 4px;

            color: white;

            font-size: 14px;

        }


        select {
            cursor: pointer;
        }


        select:disabled,
        input:disabled {

            opacity: 1;

            cursor: default;

        }


        .color-light-gray {
            background: #555960;
        }

        .color-red {
            background: #8f2924;
        }

        .color-blue {
            background: #1f4f91;
        }

        .color-green {
            background: #236c4b;
        }

        .color-purple {
            background: #65479a;
        }

        .color-orange {
            background: #a95412;
        }

        .color-yellow {
            background: #856400;
        }

        .color-sky {
            background: #238297;
        }

        .color-lime {
            background: #596b2c;
        }


        #status {

            margin-top: 8px;

            font-size: 11px;

            opacity: 0.55;

        }


        @media (max-width: 560px) {

            #fieldsGrid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

            }

        }


        @media (max-width: 400px) {

            #fieldsGrid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<div id="ctFields">

    <div id="fieldsGrid"></div>

    <div id="status"></div>

</div>


<script src="./config.js"></script>
<script src="./fields.js"></script>


</body>

</html>
