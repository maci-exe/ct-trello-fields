<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>CT Fields</title>


    <link
        rel="stylesheet"
        href="https://p.trellocdn.com/power-up.min.css"
    >


    <script src="https://p.trellocdn.com/power-up.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
    margin: 0;
    padding: 0 2px;
    background: transparent;
}


#ctFields {
    width: 100%;
}


#fieldsGrid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    column-gap: 8px;
    row-gap: 7px;

}


.field {
    min-width: 0;
}


.field label {

    display: block;

    font-weight: 600;

    margin-bottom: 3px;

    font-size: 12px;

}


select,
input {

    width: 100%;

    height: 34px;

    padding: 5px 8px;

    border: none;

    border-radius: 4px;

    color: white;

    font-size: 13px;

}


select {
    cursor: pointer;
}


select:disabled,
input:disabled {

    opacity: 1;

    cursor: default;

}


#status {

    margin-top: 4px;

    font-size: 10px;

    opacity: 0.5;

}


@media (max-width: 560px) {
    #fieldsGrid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}



    </style>

</head>


<body>


<div id="ctFields">

    <div id="fieldsGrid"></div>

    <div id="status"></div>

</div>


<script src="./config.js"></script>
<script src="./fields.js"></script>


</body>

</html>
